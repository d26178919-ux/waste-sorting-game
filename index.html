<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>กำลังเปิดเกมแยกขยะ</title>
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#082016;color:#f3f7ee;font:16px/1.6 system-ui,sans-serif}
    main{width:min(92vw,480px);padding:28px;border:1px solid #28684e;border-radius:16px;background:#0b4c3b}
    h1{margin:0 0 8px;font-size:1.25rem}p{margin:0 0 16px;color:#d5e6dc}a{display:block;margin-top:8px;color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>กำลังเปิดเกมแยกขยะ</h1>
    <p id="status" role="status" aria-live="polite">กำลังค้นหาหน้าเกม…</p>
    <a href="/Game-System/HTML/index.html">เปิดหน้าเกม</a>
    <a href="/Game-System/HTML/game-page.html">เปิดหน้าเกมสำรอง</a>
  </main>
  <script>
    (async()=>{
      const candidates=['/Game-System/HTML/index.html','/Game-System/HTML/game-page.html'];
      for(const path of candidates){
        try{
          const response=await fetch(path,{method:'HEAD',cache:'no-store'});
          if(response.ok){location.replace(path+location.search+location.hash);return}
        }catch{}
      }
      document.querySelector('#status').textContent='ไม่พบไฟล์หน้าเกม ตรวจว่าอัปโหลดโฟลเดอร์ Game-System มาครบแล้ว';
    })();
  </script>
</body>
</html>
